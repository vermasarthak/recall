[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recall"
version = "0.1.0"
description = "Temporal Entity Memory Engine for Social AI and Long-Horizon Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sarthak Verma", email = "sarthakverma0802@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "setuptools>=61.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
client = [
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "websockets>=11.0.3"
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0.3"
]

[project.scripts]
recall = "recall.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI dependency injection via function defaults (e.g. Depends(get_recall_client))
    "B904",   # Server API endpoint HTTPException re-raises from broad internal exceptions
    "B905",   # zip without strict= in math cosine similarity computation
    "UP042",  # StrEnum compatibility for Python 3.10/3.11 str-Enum subclasses
    "E501",   # Line length formatting for long test and query docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "RUF059", "DTZ001", "E501"] # Test assertions, unused test vars, and deliberate naive datetimes

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
recall = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
